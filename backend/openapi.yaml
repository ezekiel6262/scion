openapi: 3.1.0
info:
  title: Scion API
  version: 0.1.0
  description: API for private, executable, forkable investment strategies.
servers: [{ url: http://localhost:8787 }]
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, description: One-hour session returned by the NEAR wallet verification endpoint }
    NearAccount: { type: apiKey, in: header, name: x-near-account, description: Development-only identity header; disabled in production by default }
    ViewKey: { type: apiKey, in: header, name: x-view-key }
paths:
  /v1/auth/challenge:
    post: { responses: { '201': { description: Five-minute NEAR wallet signing challenge } } }
  /v1/auth/verify:
    post: { responses: { '200': { description: One-hour bearer session } } }
  /health:
    get: { responses: { '200': { description: Healthy } } }
  /v1/strategies:
    get: { responses: { '200': { description: Public strategy catalog } } }
    post: { security: [{ BearerAuth: [] }, { NearAccount: [] }], responses: { '201': { description: Strategy and immutable v1 created } } }
  /v1/versions/{versionId}:
    get:
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      security: [{ BearerAuth: [], ViewKey: [] }, { NearAccount: [], ViewKey: [] }, {}]
      responses: { '200': { description: Public or capability-projected version } }
  /v1/capabilities:
    post: { security: [{ BearerAuth: [] }, { NearAccount: [] }], responses: { '201': { description: Subject-bound capability issued } } }
  /v1/capabilities/{capabilityId}/revoke:
    post:
      parameters: [{ name: capabilityId, in: path, required: true, schema: { type: string } }]
      security: [{ BearerAuth: [] }, { NearAccount: [] }]
      responses: { '200': { description: Capability revoked } }
  /v1/forks:
    post: { security: [{ BearerAuth: [] }, { NearAccount: [] }], responses: { '201': { description: Fork and lineage edge created } } }
  /v1/executions/preview:
    post: { security: [{ BearerAuth: [] }, { NearAccount: [] }], responses: { '200': { description: Deterministic follower policy decision; non-owners must supply an execution.preview capability token in the request body }, '403': { description: Required execution capability is missing or invalid } } }
  /v1/executions:
    post: { security: [{ BearerAuth: [] }, { NearAccount: [] }], responses: { '201': { description: Execution receipt created; non-owners must supply an execution.submit capability token }, '409': { description: Manual confirmation required; resubmit with confirmedPolicyHash from preview }, '422': { description: Policy rejected execution } } }
  /v1/strategies/{strategyId}/lineage:
    get:
      parameters: [{ name: strategyId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Public lineage graph } }
