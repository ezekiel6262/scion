openapi: 3.1.0
info:
  title: Veilbranch API
  version: 0.1.0
  description: API for private, executable, forkable investment strategies.
servers: [{ url: http://localhost:8787 }]
components:
  securitySchemes:
    NearAccount: { type: apiKey, in: header, name: x-near-account, description: Development placeholder for a verified NEAR wallet session }
    ViewKey: { type: apiKey, in: header, name: x-view-key }
paths:
  /health:
    get: { responses: { '200': { description: Healthy } } }
  /v1/strategies:
    get: { responses: { '200': { description: Public strategy catalog } } }
    post: { security: [{ NearAccount: [] }], responses: { '201': { description: Strategy and immutable v1 created } } }
  /v1/versions/{versionId}:
    get:
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
      security: [{ NearAccount: [], ViewKey: [] }, {}]
      responses: { '200': { description: Public or capability-projected version } }
  /v1/capabilities:
    post: { security: [{ NearAccount: [] }], responses: { '201': { description: Subject-bound capability issued } } }
  /v1/capabilities/{capabilityId}/revoke:
    post:
      parameters: [{ name: capabilityId, in: path, required: true, schema: { type: string } }]
      security: [{ NearAccount: [] }]
      responses: { '200': { description: Capability revoked } }
  /v1/forks:
    post: { security: [{ NearAccount: [] }], responses: { '201': { description: Fork and lineage edge created } } }
  /v1/executions/preview:
    post: { responses: { '200': { description: Deterministic follower policy decision } } }
  /v1/executions:
    post: { security: [{ NearAccount: [] }], responses: { '201': { description: Execution receipt created }, '422': { description: Policy rejected execution } } }
  /v1/strategies/{strategyId}/lineage:
    get:
      parameters: [{ name: strategyId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Public lineage graph } }
